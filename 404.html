<!doctype html>

<link rel="stylesheet" href="/styles.css">
<style>
  /* The only page-specific rule on the site: the 404 is one centred stack on
     the same black, using the same three type roles as everything else. */
  .nf{min-height:100svh;display:grid;align-content:center;justify-items:center;
      gap:22px;text-align:center;padding:0 var(--gutter)}
  .nf-mark{width:56px;height:56px;margin-bottom:6px;color:var(--text)}
  /* the display-size .em spacing every other display line already has */
  .nf h1 .em{margin-left:.06em;margin-right:.05em}
  .nf h1{font-size:clamp(2.6rem,6vw,3.6rem);font-weight:500;line-height:1;letter-spacing:-.05em}
</style>
</head>
<body>
<main class="nf" id="main">
  <!-- The same inline mark the nav draws on every other page, in the same white.
       This was a gold raster of it — the amber from a palette the site no
       longer uses, the same one the share card carried — with alt text
       describing the full seal, three figures and a laurel, when the image was
       the plain cross mark. -->
  <svg class="mark nf-mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="0.7" y="15" width="3.6" height="8" rx=".3"/><rect x="5.6" y="11" width="3.6" height="12" rx=".3"/><rect x="10.3" y="1.2" width="3.8" height="21.8" rx=".3"/><rect x="6.7" y="5.4" width="11" height="3.2" rx=".3"/><rect x="15.2" y="11.5" width="3.6" height="11.5" rx=".3"/><rect x="20.1" y="15.5" width="3.2" height="7.5" rx=".3"/></svg>
  <p class="label">Catholic Leaders in Action</p>
  <h1>There is no page <span class="em">here</span>.</h1>
  <p class="desc">That address does not exist. Start from the home page.</p>
  <a class="btn btn-lg btn-fill" href="/">Go to the home page
    <svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
</main>
</body>
</html>
