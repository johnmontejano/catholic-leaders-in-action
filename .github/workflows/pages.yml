name: Deploy GitHub Pages

# The site is hand-written static HTML/CSS/JS living at the repo root — it is
# mirrored here from CLIA/site by tools/deploy.sh. There is nothing to compile,
# so this workflow uploads the checkout as-is. (It used to run `npm ci && vite
# build` against a React app; that app is gone, and the npm steps failed the
# moment its package-lock.json went with it.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
